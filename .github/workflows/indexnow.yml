name: Submit URLs to IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build first so the script knows which URLs this commit SHOULD produce.
      # Without it the script fetched the live sitemap, which on push is still
      # the previous deploy — new pages were never submitted.
      - name: Install dependencies
        run: npm ci

      - name: Build (produces dist/sitemap-0.xml for the deploy check)
        run: npm run build

      - name: Submit all sitemap URLs to IndexNow
        run: node scripts/indexnow.mjs
        env:
          CI: 'true'
